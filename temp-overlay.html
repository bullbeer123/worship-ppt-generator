
<!-- ======= Custom Page Editor Overlay ======= -->
<div class="cp-editor-overlay" id="cp-editor-overlay">
    <div class="cp-editor-window">
        <div class="cp-editor-toolbar">
            <span class="title" id="cp-editor-title">编辑自定义页面</span>
            <span style="color:#8b7a96;font-size:13px;margin:0 4px;">插入位置</span>
            <select id="cp-insert-pos" style="padding:4px 8px;border:1px solid rgba(255,255,255,0.15);border-radius:6px;background:rgba(255,255,255,0.08);color:#d4a5e8;font-size:13px;font-family:inherit;outline:none;cursor:pointer;"
                onchange="updateEditorPosition(this.value)">
            </select>
            <button onclick="addTextElement()">➕ 文字框</button>
            <button onclick="addImageElement()">🖼️ 图片</button>
            <button class="del-el-btn" id="cp-del-el-btn" onclick="deleteSelectedElement()">🗑️ 删除</button>
            <button class="close-btn" onclick="closeCustomEditor()">✕ 关闭</button>
        </div>
        <div class="cp-prop-bar" id="cp-prop-bar">
            <label>字号</label>
            <input type="number" id="cp-font-size" value="28" min="10" max="100" onchange="updateSelectedProp('fontSize', parseInt(this.value))">
            <label>颜色</label>
            <input type="color" id="cp-color" value="#ffffff" onchange="updateSelectedProp('color', this.value)">
            <button id="cp-bold-btn" onclick="toggleSelectedBold()" style="font-weight:bold;">B</button>
            <select id="cp-align" onchange="updateSelectedProp('align', this.value)">
                <option value="center">居中</option>
                <option value="left">左对齐</option>
                <option value="right">右对齐</option>
            </select>
        </div>
        <div class="cp-canvas-wrap">
            <div class="cp-canvas" id="cp-canvas">
                <div class="cp-canvas-empty" id="cp-canvas-empty">点击上方按钮添加文字框或图片</div>
            </div>
        </div>
    </div>
</div>

<!-- ======= 777宣告查看弹窗 ======= -->
<div class="decl-modal-overlay" id="decl-modal-overlay">
    <div class="decl-modal-window">
        <div class="decl-modal-header">
            <span class="title" id="decl-modal-title">7大望楼</span>
            <button onclick="closeDeclModal()">✕ 关闭</button>
        </div>
        <div class="decl-modal-body" id="decl-modal-body"></div>
    </div>
</div>

</body>
</html>
